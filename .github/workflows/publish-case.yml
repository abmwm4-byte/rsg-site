name: Publish case

# Расписание временно выключено: сначала Влад копит черновики, мы их
# проверяем — потом включим cron обратно (пн и чт 10:00 Минск = 07:00 UTC).
on:
  # schedule:
  #   - cron: '0 7 * * 1,4'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Publish oldest draft case
        env:
          CASE_IMPORT_TOKEN: ${{ secrets.CASE_IMPORT_TOKEN }}
        run: node scripts/publish-cases.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Кейс из CRM (автопубликация по расписанию)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "нет новых черновиков"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Пуш из Actions (GITHUB_TOKEN) НЕ триггерит другие воркфлоу — деплоим сами
      - name: Build
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: steps.commit.outputs.changed == 'true'
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
